<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winxs - Estoques </title>
    <link rel="stylesheet" href="Login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
    <div class="Container">
<div class="Center">
    <div class="Center-logo">
        <img  src="Img/Logo.png" alt="Winx Logo">
        <div>
            <h1>Entre na sua conta <span>Winx's</span></h1>
        </div>
    </div>
    
    <form id="form-login">
        <input type="email" id="login-email" required placeholder="*****@gmail.com">
        <input type="password" id="login-senha" required placeholder="********">
        
        <div class="Login">
            <button type="submit" class="btn-login" id="btn-login">Logar</button>
        </div>
    </form>

</div>
    </div>
    
<script src="Login.js"></script>
</body>
