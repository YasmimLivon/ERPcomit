<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela de inicio Winx</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-card">
      <nav class="sidebar">
        
        <div class="logo-winx"><img src="img/Logo.png" alt="Logo Winxs"></div>
                
        <a href="#" class="nav-item icon-fornecedores">Fornecedores e Clientes </a>

        <a href="#" class="nav-item icon-vendas"> Vendas</a>

        <a href="#" class="nav-item icon-estoque">Estoque</a>

        <a href="#" class="nav-item icon-funcionarios">Funcionários</a>

        <a href="#" class="nav-item icon-folha">Folha de Pagamento</a>

        <a href="#" class="nav-item icon-financeiro">Financeiro</a>

        <a href="#" class="nav-item active icon-produtos">Produtos </a>

            <a href="#" class="nav-item icon-vendas-simple">Vendas Simples</a>

            </nav>
      
      
<section class="section-container">
    <div class="form-box">
        <h1 class="title">Crie seu Produto</h1>
        
        <form class="form-content">
            <div class="input-group">
                <span class="group-label">Dados do Produto</span>
                <div class="row">
                    <input type="text" class="input-field" placeholder="Nome do Produto">
                    <input type="text" class="input-field" placeholder="Código do Produto">
                </div>
            </div>

            <div class="divider"></div>

            <div class="input-group">
                <span class="group-label">Vendas</span>
                <div class="row">
                    <input type="text" class="input-field" placeholder="Preço de Venda">
                    
                </div>
            </div>

            <div class="divider"></div>

            <div class="input-group center-items">
                <input type="text" class="input-field pill-dark" placeholder="quantidade produto" readonly>
                <div class="select-container">
                      <input type="number" class="input-field" placeholder="0">
                </div>
            </div>

            <button type="submit" class="btn-main">Registrar</button>
        </form>
    </div>
</section>


  </body>
  
</html>
