<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winx - Painel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-card">
      <nav class="sidebar">
        <div class="logo-winx"><img src="img/Logo.png" alt="Logo Winxs"></div>
        <a href="#" class="nav-item active">Contatos</a>
        <a href="#" class="nav-item">Estoque</a>
        <a href="#" class="nav-item">Funcionários</a>
        <a href="#" class="nav-item">Configurações</a>
      </nav>

      <main class="content-area">
        <header class="content-header">
          <h1>Contatos</h1>
          <button class="btn-adicionar">Adicionar Novo</button>
        </header>

        <div class="data-table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Identificação</th>
                <th>Tipo</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Cláudia</td>
                <td>123.456.789-00</td>
                <td>Cliente</td>
                <td><a href="#" class="action-link">Editar</a></td>
              </tr>
              <tr>
                <td>Logística Express</td>
                <td>12.345.678/0001-99</td>
                <td>Fornecedor</td>
                <td><a href="#" class="action-link">Editar</a></td>
              </tr>
              <tr>
                <td>José Silva</td>
                <td>456.789.123-11</td>
                <td>Cliente</td>
                <td><a href="#" class="action-link">Editar</a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
