<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winx - Fornecedores e Clientes</title>
    <link rel="stylesheet" href="../css/Forne&Cli.css" />
</head>
<body>
    <div class="app-card">
        <nav class="sidebar" id="sidebar-menu">
            <div class="logo-winx">
                <img src="../img/Logo.png" alt="Logo Winxs">
            </div>
    <a href="Forne&Cli.html" class="nav-item active data-role-only" data-allowed="funcionarios">Fornecedores e Clientes</a>
    <a href="itempedido.html" class="nav-item data-role-only" data-allowed="admin,funcionarios,cliente">Vendas</a>
    <a href="Estoque.Html" class="nav-item data-role-only" data-allowed="funcionarios,fornecedor">Estoque</a>
    <a href="Funcionario.html" class="nav-item data-role-only" data-allowed="funcionarios">Funcionários</a>
    <a href="folhadepagamento.html" class="nav-item data-role-only" data-allowed="funcionarios">Folha de Pagamento</a>
    <a href="Financeiro.html" class="nav-item data-role-only" data-allowed="funcionarios">Financeiro</a>
    <a href="ListagemProdutos.Html" class="nav-item data-role-only" data-allowed="funcionarios,fornecedor,cliente">Produtos</a>
        </nav>
      
        <div class="content-area">
            <div class="area-login">
                <button class="btn-sair" id="btn-sair">Sair</button>
            </div>

            <header class="content-header">
                <h1>Fornecedores e Clientes</h1>
                <div class="Buttons-adfil">
                    <button class="btn-filtrar" id="btn-abrir-filtro">Filtrar</button>
                    <button class="btn-adicionar" id="btn-abrir-modal">Adicionar</button>
                </div>
            </header>

            <div class="table-container">
                <table>
                    <thead>
                        <tr id="cabecalho">
                            <th>Nome</th>
                            <th>Cnpj / Cpf</th>
                            <th>Cidade</th>
                            <th>Telefone</th>
                            <th>Tipo</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-container" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Cadastrar Novo</h2>
            <form id="form-cadastro">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" required>
                </div>
                
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label id="label-doc">CPF</label>
                        <input type="text" id="documento" required>
                    </div>
                    <div class="input-group">
                        <label>Tipo</label>
                        <select id="tipo">
                            <option value="Cliente">Cliente</option>
                            <option value="Fornecedor">Fornecedor</option>
                        </select>
                    </div>
                </div>

                <div class="input-row">
                    <div id="col-cidade" class="input-group">
                        <label>Cidade</label>
                        <input type="text" id="cidade">
                    </div>
                    <div class="input-group">
                        <label>Telefone</label>
                        <input type="text" id="telefone" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="password" placeholder="Deixe em branco para manter a atual">
                </div>

                <input type="hidden" id="role" value="User">

                <div class="modal-actions">
                    <button type="button" class="btn-cancelar" id="btn-fechar-modal">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

<div id="modal-filtro" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2>Filtrar Registros</h2>
        <form id="form-filtro">
            <div class="input-group">
                <label>Nome do Parceiro</label>
                <input type="text" id="filtro-nome" placeholder="Digite o nome...">
            </div>
            
            <div class="input-row">
                <div class="input-group">
                    <label>Tipo</label>
                    <select id="filtro-tipo">
                        <option value="Todos">Todos</option>
                        <option value="Cliente">Cliente</option>
                        <option value="Fornecedor">Fornecedor</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Cidade</label>
                    <input type="text" id="filtro-cidade" placeholder="Cidade...">
                </div>
            </div>

            <div class="modal-actions" style="justify-content: space-between; align-items: center;">
                <button type="button" id="btn-resetar-filtro" style="background: none; border: none; color: #ff002b; font-weight: bold; cursor: pointer; text-decoration: underline; font-size: 13px;">
                    Limpar Filtros
                </button>
                
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn-cancelar" id="btn-fechar-filtro">Cancelar</button>
                    <button type="submit" class="btn-salvar">Aplicar</button>
                </div>
            </div>
        </form>
    </div>
</div>

    <script src="../JavaScript/Forne&Cli.js"></script>
    <script src="../auth-guard.js"></script>
</body>
</html>
