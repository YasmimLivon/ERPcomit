<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Winxs - Cadastro</title>
    <link rel="icon" href="../img/Logo.png" type="image/png">
  <link rel="stylesheet" href="../css/Cadastro.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <section id="Cadastro">
    <div class="container">
      
      <div class="esquerda">
        <img src="../img/imagem.png" alt="Imagem de Cadastro" />
      </div>

      <div class="direita">
        <div class="box-card">
          <h1>Crie sua conta na <span>Winx's</span></h1>
          
          <form id="registrationForm">
            <div class="grid">

              <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" name="username" placeholder="Nome Completo" required />
              </div>

              <div class="input-box">
                <i class="fa-solid fa-phone"></i>
                <input type="text" id="numero" name="numero" placeholder="Telefone" required />
              </div>

              <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="E-mail" required />
              </div>

              <div class="input-box">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" id="cpf" name="cpf" placeholder="CPF" required />
              </div>

              <div class="input-box full">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" id="endereco" name="endereco" placeholder="Endereço" required />
              </div>
              <div class="input-box full">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Digite sua Senha" required />
              </div>

            </div>

            <button type="submit" id="btn-CriarConta">Criar Conta</button>
            <div class="center">
              <p>Já tem uma conta? <a href="../Index.html">Faça login</a></p>
            </div>
          </form>
        </div>
      </div>

    </div>
  </section>

  <script src="../JavaScript/Cadastro.js"></script>
</body>
</html>
