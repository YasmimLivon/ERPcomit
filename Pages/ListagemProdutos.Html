<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winx - Gestão de Produtos</title>
    <link rel="stylesheet" href="../css/Listagem.css" />
</head>
<body>

    <div class="app-card">
        <nav class="sidebar">
            <div class="logo-winx">
                <img src="../img/Logo.png" alt="Winx Logo" />
            </div>
     <a href="Forne&Cli.html" class="nav-item ">Fornecedores e Clientes</a>
        <a href="itempedido.html" class="nav-item">Vendas</a>
        <a href="Estoque.Html" class="nav-item">Estoque</a>
        <a href="#" class="nav-item">Funcionários</a>
        <a href="folhadepagamento.html" class="nav-item">Folha de Pagamento</a>
        <a href="Financeiro.html" class="nav-item">Financeiro</a>
        <a href="ListagemProdutos.Html" class="nav-item active">Produtos</a>
            
        </nav>

        <div class="content-area">
          <div class="area-sair">
                <button class="btn-sair" id="btn-sair">Sair</button>
          </div>
            <header class="content-header">
                <h1>Produtos</h1>
                <div class="buttons-actions">
                    <button class="btn-filtrar">Filtrar</button>
                    <button id="openModalBtn" class="btn-adicionar">Adicionar</button>
                </div>
            </header>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Camisa Branca</td>
                            <td>R$ 45,00</td>
                            <td>120</td>
                            <td>
                                <div class="acao-buttons">
                                    <button class="btn-edit">Editar</button>
                                    <button class="btn-delete">🗑️</button>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>Calça Jeans Azul</td>
                            <td>R$ 129,90</td>
                            <td>75</td>
                            <td>
                                <div class="acao-buttons">
                                    <button class="btn-edit">Editar</button>
                                    <button class="btn-delete">🗑️</button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="productModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" id="closeModalBtn">&times;</span>
            <div class="form-modal">
                <h2>Crie seu Produto</h2>
                <form id="productForm">
                    <div class="input-group">
                        <label>Dados do Produto</label>
                        <div class="row">
                            <input type="text" class="input-pill" placeholder="Nome do Produto" required>
                            <input type="text" class="input-pill" placeholder="Código">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Vendas</label>
                        <input type="text" class="input-pill" placeholder="Preço de Venda">
                    </div>

                    <div class="input-group center">
                        <div class="label-destaque">Quantidade Produto</div>
                        <input type="number" class="input-pill" value="0">
                    </div>

                    <button type="submit" class="btn-registrar">Registrar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../JavaScript/produtos.js"></script>
</body>
</html>
