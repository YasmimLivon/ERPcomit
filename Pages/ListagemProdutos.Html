    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Winx - Gestão de Produtos</title>
        <link rel="stylesheet" href="../css/Listagem.css" />
    </head>
    <body>

    <div class="app-card">

        <nav class="sidebar" id="sidebar-menu">
            <div class="logo-winx">
                <img src="../img/Logo.png" />
            </div>
                <a href="Dashboard.html" class="nav-item  ">Dashboard</a>
            <a href="ListagemProdutos.Html" class="nav-item active data-role-only" data-allowed="funcionarios,fornecedor,cliente">Produtos</a>
            <a href="Pedido.html" class="nav-item  data-role-only" data-allowed="admin,funcionarios,cliente">Pedidos</a>
        <a href="itempedido.html" class="nav-item data-role-only" data-allowed="admin,funcionarios,cliente">Vendas</a>
        <a href="Estoque.Html" class="nav-item data-role-only" data-allowed="funcionarios,fornecedor">Estoque</a>
        <a href="Forne&Cli.html" class="nav-item data-role-only" data-allowed="funcionarios">Fornecedores e Clientes</a>
        <a href="Funcionario.html" class="nav-item data-role-only" data-allowed="funcionarios">Funcionários</a>
        <a href="folhadepagamento.html" class="nav-item data-role-only" data-allowed="funcionarios">Folha de Pagamento</a>
        <a href="Financeiro.html" class="nav-item data-role-only" data-allowed="funcionarios">Financeiro</a>
        </nav>

        <div class="content-area">

            <div class="area-sair">
                <button class="btn-sair" id="btn-sair">Sair</button>
            </div>

            <header class="content-header">
                <h1>Produtos</h1>

                <div class="buttons-actions">
                    <input type="text" id="inputFiltro" placeholder="🔍 Buscar produto..." />
                    <button id="openModalBtn" class="btn-adicionar">Adicionar</button>
                </div>
            </header>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Código</th>
                            <th>Estoque</th>
                            <th>Tipo</th>
                            <th>Ativo</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo"></tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- MODAL -->
    <div id="productModal" class="modal-overlay">
        <div class="modal-content">

            <span class="close-modal" id="closeModalBtn">&times;</span>

            <h2>Cadastro de Produto</h2>

            <form id="productForm">
            <input id="nome" type="text" class="input-pill" placeholder="Nome do Produto" required>
            <input id="codigo" type="text" class="input-pill" placeholder="Código">
            <input id="preco" type="text" class="input-pill" placeholder="Preço de Venda">
            <input id="quantidade" type="number" class="input-pill" value="0">
            <input id="tipo" type="text" class="input-pill" placeholder="Tipo">
            <label class="checkbox">
                <input type="checkbox" id="ativo" checked>Produto Ativo
            </label>

                <button type="submit" class="btn-registrar">Cadastrar</button>

            </form>

        </div>
    </div>

    <script src="../JavaScript/produtos.js"></script>
    <script src="../auth-guard.js"></script>
    </body>
    </html>
