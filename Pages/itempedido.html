<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winx - Vendas</title>
    <link rel="stylesheet" href="../css/Forne&Cli.css" />
  </head>
  <body>
    <div class="app-card">
      <nav class="sidebar">
        <div class="logo-winx">
          <img src="../img/Logo.png" alt="Logo Winxs" />
        </div>
        <a href="Forne&Cli.html" class="nav-item">Fornecedores e Clientes</a>
        <a href="itempedido.html" class="nav-item active">Vendas</a>
        <a href="Estoque.Html" class="nav-item">Estoque</a>
        <a href="#" class="nav-item">Funcionários</a>
        <a href="folhadepagamento.html" class="nav-item">Folha de Pagamento</a>
        <a href="Financeiro.html" class="nav-item">Financeiro</a>
        <a href="ListagemProdutos.Html" class="nav-item">Produtos</a>
      </nav>

      <div class="content-area">
        <div class="area-login">
          <button class="btn-sair" id="btn-sair">Sair</button>
        </div>

        <header class="content-header">
          <h1>Vendas</h1>
          <div class="Buttons-adfil">
            <button class="btn-filtrar" id="btn-abrir-filtro">Filtrar</button>
            <button class="btn-adicionar" id="btn-abrir-modal">
              Adicionar
            </button>
          </div>
        </header>

        <div class="table-container">
          <table>
            <thead>
              <tr id="cabecalho">
                <th>Nome Cliente</th>
                <th>Produto</th>
                <th>Preço Unitario</th>
                <th>Quantidade</th>
                <th>Descrição</th>
                <th>Status</th>
                <th>Total</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="modal-container" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <h2>Cadastrar Novo Venda</h2>
        <form id="form-cadastro">
          <div class="input-group">
            <label>Nome Cliente</label>
            <input type="text" id="nome" required />
          </div>

          <div class="input-group">
            <label>Descrição Do pedido</label>
            <input
              type="Texto"
              id="Descricao-Pedido"
              placeholder="Aqui você pode adicionar detalhes do pedido, como quantidade, cor, etc."
            />
          </div>

          <div class="input-row">
            <div class="input-group">
              <label id="label-doc">Produto / Serviço </label>
              <input type="text" id="Produto-Servico" required />
            </div>
            <div class="input-group">
              <label>Quantidade</label>
              <select id="tipo">
                <option value="">1</option>
                <option value="">2</option>
                <option value="">3</option>
              </select>
            </div>
          </div>

          <div class="input-group">
            <label>Preço Unitario</label>
            <input type="text" id="Preco-Uni" required placeholder="R$ 0,00" />
          </div>

          <input type="hidden" id="role" value="User" />

          <div class="modal-actions">
            <button type="button" class="btn-cancelar" id="btn-fechar-modal">
              Cancelar
            </button>
            <button type="submit" class="btn-salvar">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <div id="modal-filtro" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <h2>Filtrar Registros</h2>
        <form id="form-filtro">
          <div class="input-group">
            <label>Nome do Parceiro</label>
            <input
              type="text"
              id="filtro-nome"
              placeholder="Digite o nome..."
            />
          </div>

          <div class="input-row">
            <div class="input-group">
              <label>Tipo</label>
              <select id="filtro-tipo">
                <option value="Todos">Todos</option>
                <option value="Cliente">Cliente</option>
                <option value="Fornecedor">Fornecedor</option>
              </select>
            </div>
            <div class="input-group">
              <label>Cidade</label>
              <input type="text" id="filtro-cidade" placeholder="Cidade..." />
            </div>
          </div>

          <div
            class="modal-actions"
            style="justify-content: space-between; align-items: center"
          >
            <button
              type="button"
              id="btn-resetar-filtro"
              style="
                background: none;
                border: none;
                color: #ff002b;
                font-weight: bold;
                cursor: pointer;
                text-decoration: underline;
                font-size: 13px;
              "
            >
              Limpar Filtros
            </button>

            <div style="display: flex; gap: 10px">
              <button type="button" class="btn-cancelar" id="btn-fechar-filtro">
                Cancelar
              </button>
              <button type="submit" class="btn-salvar">Aplicar</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script src="../JavaScript/Itempedido.js"></script>
  </body>
</html>
