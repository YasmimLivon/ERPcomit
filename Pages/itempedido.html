<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winx -Item pedido</title>
    <link rel="stylesheet" href="../css/itempedido.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&family=Open+Sans&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app-card">
      <nav class="sidebar" id="sidebar-menu">
        <div class="logo-winx" >
          <img src="../img/Logo.png" alt="Logo Winxs" />
        </div>
    <a href="Forne&Cli.html" class="nav-item data-role-only" data-allowed="funcionarios">Fornecedores e Clientes</a>
    <a href="itempedido.html" class="nav-item active data-role-only" data-allowed="admin,funcionarios,cliente">Vendas</a>
    <a href="Estoque.Html" class="nav-item data-role-only" data-allowed="funcionarios,fornecedor">Estoque</a>
    <a href="Funcionario.html" class="nav-item data-role-only" data-allowed="funcionarios">Funcionários</a>
    <a href="folhadepagamento.html" class="nav-item data-role-only" data-allowed="funcionarios">Folha de Pagamento</a>
    <a href="Financeiro.html" class="nav-item data-role-only" data-allowed="funcionarios">Financeiro</a>
    <a href="ListagemProdutos.Html" class="nav-item data-role-only" data-allowed="funcionarios,fornecedor,cliente">Produtos</a>
      </nav>

      <section id="financeiro">
        <div class="content-area">
          <div class="area-login">
            <button class="btn-sair" id="btn-sair">Sair</button>
          </div>
        <header class="content-header">
        <div style="display:flex; align-items:center; gap:10px;">
        <img src="../img/carrinho azul.png" alt="carrinho" />
        <h1>Modulo Vendas</h1>
    </div>

        <div class="Buttons-adfil">
        <input type="text" id="inputFiltro" class="input-busca" placeholder="Buscar produto..."
    />
    <button id="openModalBtn" class="btn-adicionar">Adicionar</button>
  </div>
</header>

            <div class="table-container">
              <table>
                <thead>
                  <tr id="cabecalho">
                    <th>Item Id</th>
                    <th>Produto/Serviço</th>
                    <th>Preço unitário</th>
                    <th>Quantidade</th>
                    <th>Total</th>
                    <th>Ações Rápidas</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <!-- MODAL -->
            <div
              id="modal-container"
              class="modal-overlay"
              style="display: none"
            >
              <div class="modal-content">
                <h2>Cadastrar Nova Venda</h2>

                <form id="form-cadastro">
                  <div class="input-group">
                    <label>Pedido Id</label>
                    <input type="number" id="pedidoId" required />
                  </div>

                  <div class="input-group">
                    <label>Descrição</label>
                    <!-- MANTIDO (não usado pela API) -->
                    <input type="text" id="descricao" />
                  </div>

                  <div class="input-row">
                    <div class="input-group">
                      <label id="label-doc">Produto/Serviço</label>
                      <!-- ALTERADO -->
                      <input type="number" id="produtoId" required />
                    </div>

                    <div class="input-group">
                      <label>Quantidade</label>
                      <!-- ALTERADO -->
                      <input type="number" id="quantidade" required />
                    </div>
                  </div>

                  <div class="input-group">
                    <label>Preço Unitário</label>
                    <!-- ALTERADO -->
                    <input type="number" id="precoUnitario" required />
                  </div>

                  <input type="hidden" id="role" value="User" />

                  <div class="modal-actions">
                    <button
                      type="button"
                      class="btn-cancelar"
                      id="btn-fechar-modal"
                    >
                      Cancelar
                    </button>
                    <button type="submit" class="btn-salvar">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

        </div>
        </section>
        <script src="../JavaScript/itempedido.js"></script>
        <script src="../auth-guard.js"></script>
</body>
</html>
