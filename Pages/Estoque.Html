<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Winx - Estoque</title>
    <link rel="stylesheet" href="../css/Estoque.css" />
  </head>

  <body>
    <div class="app-card">
      <nav class="sidebar " id="sidebar-menu">
        <div class="logo-winx">
          <img src="../img/Logo.png" />
        </div>

    <a href="Forne&Cli.html" class="nav-item data-role-only" data-allowed="funcionarios">Fornecedores e Clientes</a>
    <a href="itempedido.html" class="nav-item data-role-only" data-allowed="admin,funcionarios,cliente">Vendas</a>
    <a href="Estoque.Html" class="nav-item active data-role-only" data-allowed="funcionarios,fornecedor">Estoque</a>
    <a href="Funcionario.html" class="nav-item data-role-only" data-allowed="funcionarios">Funcionários</a>
    <a href="folhadepagamento.html" class="nav-item data-role-only" data-allowed="funcionarios">Folha de Pagamento</a>
    <a href="Financeiro.html" class="nav-item data-role-only" data-allowed="funcionarios">Financeiro</a>
    <a href="ListagemProdutos.Html" class="nav-item data-role-only" data-allowed="funcionarios,fornecedor,cliente">Produtos</a>
      </nav>

      <div class="content-area">
        <div class="area-login">
          <button class="btn-sair" id="btn-sair">Sair</button>
        </div>

        <header class="content-header">
          <h1>Estoque</h1>

          <div class="Buttons-adfil">
            <input
              type="text" id="inputFiltro" placeholder="Buscar produto..." />
          
          </div>
        </header>

        <div class="table-container">
          <table>
            <thead>
              <tr id="cabecalho">
                <th>Produtos</th>
                <th>Quantidade</th>
                <th>Valor Un</th>
                <th>Codigo</th>

              </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
          </table>
        </div>

        <!-- NOVOS BOTÕES -->
        <div class="footer-actions">
          <button class="btn-entrada">+ Entrada</button>
          <button class="btn-saida">- Saída</button>
        </div>
      </div>
    </div>
    <div id="modalMovimentacao" class="modal hidden">
      <div class="modal-box">
        <h2 id="modalTitulo">Movimentação</h2>

        <div class="form-grid">
          <div class="input-group">
            <label>Produto</label>
            <select id="produtoId"></select>
          </div>

          <div class="input-group">
            <label>Tipo</label>
            <select id="tipo">
              <option value="0">Entrada</option>
              <option value="1">Saída</option>
              <option value="2">Devolução</option>
            </select>
          </div>

          <div class="input-group">
            <label>Quantidade</label>
            <input type="number" id="quantidade" />
          </div>

          <div class="input-group">
            <label>Preço Unitário</label>
            <input type="number" id="precoUnitario" />
          </div>

          <div class="input-group">
            <label>Data</label>
            <input type="datetime-local" id="data" />
          </div>

          <div class="input-group">
            <label>Pedido ID (opcional)</label>
            <input type="number" id="pedidoId" />
          </div>
        </div>

        <div class="modal-actions">
          <button id="cancelarMov" class="btn-cancelar">Cancelar</button>
          <button id="confirmarMov" class="btn-salvar">Salvar</button>
        </div>
      </div>
    </div>
    <script src="../JavaScript/Estoque.js"></script>
    <script src="../auth-guard.js"></script>
  </body>
</html>
