<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winx - Financeiro</title>
    <link rel="stylesheet" href="../css/Financeiro.css">
</head>
<body>
    <div class="app-card">
        <nav class="sidebar" id="sidebar-menu">
            <div class="logo-winx">
                <img src="../img/Logo.png" alt="Logo Winxs">
            </div>
    <a href="Forne&Cli.html" class="nav-item data-role-only" data-allowed="funcionarios">Fornecedores e Clientes</a>
    <a href="itempedido.html" class="nav-item data-role-only" data-allowed="admin,funcionarios,cliente">Vendas</a>
    <a href="Estoque.Html" class="nav-item data-role-only" data-allowed="funcionarios,fornecedor">Estoque</a>
    <a href="Funcionario.html" class="nav-item data-role-only" data-allowed="funcionarios">Funcionários</a>
    <a href="folhadepagamento.html" class="nav-item data-role-only" data-allowed="funcionarios">Folha de Pagamento</a>
    <a href="Financeiro.html" class="nav-item active data-role-only" data-allowed="funcionarios">Financeiro</a>
    <a href="ListagemProdutos.Html" class="nav-item data-role-only" data-allowed="funcionarios,fornecedor,cliente">Produtos</a>
        </nav>
      
        <div class="content-area">
            <div class="area-login">
                <button class="btn-sair" id="btn-sair">Sair</button>
            </div>

            <header class="content-header">
                <h1>Visão geral financeiro simplificada</h1>
                <div class="Buttons-adfil">
                    <button class="btn-filtrar">Filtrar</button>
                    <button class="btn-adicionar" id="btn-abrir-modal">Relatórios</button>
                </div>
            </header>

            <h4>Lista de contas (A pagar/ Receber)</h4>
            <div class="table-container">
                <table>
                    <thead>
                        <tr id="cabecalho">
                           <th>Tipo</th>
                            <th>Vencimento</th>
                            <th>Descrição</th>
                            <th>Status</th>
                            <th>Valor</th>
                            <th>Observação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                        </tbody>
                </table>
            </div>

             </div> </div> <div id="modal-container" class="modal-overlay" style="display: none;">
            <div class="modal-content">
            <h2>Gestão de conta a pagar</h2>
            <form id="form-cadastro">
            <p class="subtitle">Cadastrar Contas a Pagar ou Receber</p>

            <div class="input-group">
            <label>Tipo</label>
            <input type="text" placeholder="Digite o tipo de conta..." id="tipo">
            </div>
                
            <div class="input-group">
            <label>Nova conta (descrição)</label>
            <input type="text" placeholder="Digite a descrição..." id="descricao">
            </div>

            <div class="input-group">
            <label>Valor</label>
            <input type="text" placeholder="R$ 0,00" id="valor">
            </div>

            <div class="input-group">
            <label>Data de Vencimento</label>
            <input type="date" id="vencimento">
            </div>

            <div class="input-row">
            <div class="input-group">
            <label for="status-select">A pagar ou Receber?</label>
            <select name="status" id="status-select" required>
            <option>A Pagar</option>
            <option>A Receber</option>
            </select>
            </div>
            </div>

            <div class="input-group">
            <label>Observação</label>
            <input type="text" placeholder="Digite uma observação..." id="observacao">
            </div>

            <input type="hidden" id="role" value="funcionarios">

                <div class="modal-actions">
                    <button type="button" class="btn-cancelar" id="btn-fechar-modal">Cancelar</button>
                    <button type="submit" class="btn-salvar" id="btn-salvar-modal">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../JavaScript/Financeiro.js"></script>
</body>
</html>
