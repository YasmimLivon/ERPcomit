<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionário</title>
    <link rel="stylesheet" href="../css/funcionario.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" 
    rel="stylesheet">
</head>
<body>
    
    <div class="app-card">

    <nav class="sidebar">
        <div class="logo-winx">
            <img src="../img/Logo.png">
        </div>

     <a href="Forne&Cli.html" class="nav-item ">Fornecedores e Clientes</a>
        <a href="itempedido.html" class="nav-item">Vendas</a>
        <a href="Estoque.Html" class="nav-item">Estoque</a>
        <a href="Funcionario.html" class="nav-item active">Funcionários</a>
        <a href="folhadepagamento.html" class="nav-item">Folha de Pagamento</a>
        <a href="Financeiro.html" class="nav-item">Financeiro</a>
        <a href="ListagemProdutos.Html" class="nav-item ">Produtos</a>
    </nav>

    <div class="content-area">

        <div class="area-login">
                <button class="btn-sair" id="btn-sair">Sair</button>
        </div>

        <header class="content-header">
            <h1>Funcionários</h1>

            <div class="Buttons-adfil">
                <button class="btn-filtrar">Filtrar</button>
                <button class="btn-adicionar">Adicionar</button>
            </div>
        </header>

       <div class="table-container">
    <table>
        <thead>
            <tr id="cabecalho">
                <th>Nome</th>
                <th>CNPJ/CPF</th>
                <th>Cidade</th>
                <th>Telefone</th>
                <th>Cargo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
      
          
        </tbody>
    </table>
</div>

        <div id="modal-container" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Cadastrar Novo Funcionário</h2>
            <form id="form-cadastro">
                <div class="input-group">
                    <label>Nome</label>
                    <input type="text" id="nome" placeholder="Digite o seu nome" required>
                </div>
                
                <div class="input-group">
                    <label>Email</label>
                    <input type="text" id="email" placeholder="Digite o seu Email" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label id="label-doc">cargo</label>
                        <select name="cargo" id="label-doc" required>
                        <option value="text">Design Gráfico</option>
                        <option value="text">Gerente de Vendas</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Salário</label>
                    <input type="number" id="salario" placeholder="Ex: R$ 12,00" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="Ex: Senai123" required>
                </div>

                <input type="hidden" id="role" value="User">

                <div class="modal-actions">
                    <button type="button" class="btn-cancelar" id="btn-fechar-modal">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    </div>
</div>
    <script src="../JavaScript/Funcionario.js"></script>
</body>
</html>
